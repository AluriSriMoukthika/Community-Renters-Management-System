<!DOCTYPE html>
<html>
<head>
    <title>Maintenance Requests</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>

<h1>Maintenance Requests</h1>

<div class="form-container">
    <h3>Add Maintenance Request</h3>

    <input type="number" id="req_id" placeholder="Req_ID">
    <input type="number" id="unit_id" placeholder="Unit_ID">
    <input type="number" id="renter_id" placeholder="Renter_ID">
    <input type="text" id="type" placeholder="Type">
    <input type="text" id="priority" placeholder="Priority">
    <input type="text" id="status" placeholder="Status">

    <button onclick="addMaintenance()">Add Request</button>
</div>

<div class="table-container">
    <table id="maintenanceTable">
        <thead>
            <tr>
                <th>Req_ID</th>
                <th>Unit_ID</th>
                <th>Renter_ID</th>
                <th>Type</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>



<script>
window.onload = () => {
    if (window.location.pathname.includes("maintenance")) {
        loadMaintenance();
    }
};
</script>

</body>
</html>
