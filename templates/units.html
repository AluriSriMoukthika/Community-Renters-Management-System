<!DOCTYPE html>
<html>
<head>
    <title>Units</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</head>
<body>
<h1>Units</h1>

<div class="form-container">
    <h3>Add Unit</h3>

    <input type="number" id="unit_id" placeholder="Unit_ID" required>
    <input type="number" id="com_id" placeholder="Com_ID">
    <input type="text" id="unit_address" placeholder="Unit Address">
    <input type="text" id="mail_box_num" placeholder="Mail_box_Num">
    <input type="number" id="occupancy" placeholder="Occupancy">
    <input type="number" step="0.01" id="rent" placeholder="Rent">

    <button onclick="addUnit()">Add Unit</button>
</div>

<div class="table-container">
    <table id="unitsTable">
        <thead>
            <tr>
                <th>Unit_ID</th>
                <th>Com_ID</th>
                <th>Unit_Address</th>
                <th>Mail_box_Num</th>
                <th>Occupancy</th>
                <th>Rent</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</body>
</html>
