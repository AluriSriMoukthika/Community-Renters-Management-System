<!DOCTYPE html>
<html>
<head>
    <title>Gaming Cafe</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='gaming_cafe.js') }}" defer></script>
</head>
<body>

<h1>Gaming Cafe</h1>

<div class="form-container">
    <h3>Add Gaming Cafe Entry</h3>
    <input type="number" id="gaming_amenity_id" placeholder="Amenity_ID">
    <input type="number" id="unit_id" placeholder="Unit_ID">
    <input type="number" id="renter_id" placeholder="Renter_ID">
    <button id="addGamingCafeBtn">Add Entry</button>
</div>

<div class="table-container">
    <table id="gamingCafeTable">
        <thead>
            <tr>
                <th>Gaming_ID</th>
                <th>Amenity_ID</th>
                <th>Unit_ID</th>
                <th>Renter_ID</th>
                <th>Cafe_Fee</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</body>
</html>
