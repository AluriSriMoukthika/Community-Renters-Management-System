<!DOCTYPE html>
<html>
<head>
    <title>Gym</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='gym.js') }}" defer></script>
</head>
<body>

<h1>Gym</h1>

<div class="form-container">
    <h3>Add Gym Entry</h3>
    <input type="number" id="gym_amenity_id" placeholder="Amenity_ID">
    <input type="number" id="unit_id" placeholder="Unit_ID">
    <input type="number" id="renter_id" placeholder="Renter_ID">
    <label>
        <input type="checkbox" id="trainer"> Trainer
    </label>
    <button id="addGymBtn">Add Gym Entry</button>
</div>

<div class="table-container">
    <table id="gymTable">
        <thead>
            <tr>
                <th>Gym_ID</th>
                <th>Amenity_ID</th>
                <th>Unit_ID</th>
                <th>Renter_ID</th>
                <th>Trainer</th>
                <th>Gym_Fee</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

</body>
</html>
